- date: "2 Nov 2026"
  tag: "news"
  content: >
    I am sad I left my beloved MLR team at Bayer. But the geometric calling was way too strong,
    and I am looking forward to working on geometric generative models with
    [Michael Bronstein](https://www.cs.ox.ac.uk/people/michael.bronstein/), in collaboration with Oxford and AITHYRA. If you are excited too, have a look at the research of [Iolo](https://www.iolojones.co.uk/), [Manuel](https://manuellecha.com/), [Jacob](https://jacobbamb.github.io/)
    and [Teodora](https://scholar.google.com/citations?user=2jJ0s38AAAAJ&hl=en). ♥

- date: "24 Oct 2026"
  tag: "paper"
  content: >
    Federica led a brilliant group of students working on evaluation metrics on Riemannian manifolds. Their [workshop paper](https://arxiv.org/abs/2610.33731) got accepted at [GDDL](https://gddl-neurips-2026.github.io/) at NeurIPS in Paris. So much love to them, and so happy I could help too. :)

- date: "28 Aug 2026"
  tag: "workshop"
  content: >
    [NeurReps](https://www.neurreps.org/) received more than 350 submissions across the extended abstracts, proceedings and findings tracks (!)

- date: "15 Aug 2026"
  tag: "news"
  content: >
    Released [minimol-onnx](https://pypi.org/project/minimol-onnx/). After struggling with too many environment incompatibilities, and inspired by [cddd-onnx](https://pypi.org/project/cddd-onnx/), I decided to make my own minimol-onnx.
    ONNX [here](https://onnx.ai/onnx/intro/python.html) should really be the gold standard when deploying a model.

- date: "17 Jul 2026"
  tag: "workshop"
  content: >
    [NeurReps](https://www.neurreps.org/) will return to NeurIPS (Sydney). More information coming soon. 


- date: "17 Jul 2026"
  tag: "paper"
  content: >
    The GRaM 2026 proceedings are on their way to publication in PMLR (volume 326).
    It was also a joy to gather the results of the GRaM competition into a meta-analysis [paper](https://proceedings.mlr.press/v326/suk26a.html). :)

- date: "26 Apr 2026"
  tag: "workshop"
  content: >
    [GRaM 2026](https://iclr.cc/virtual/2026/workshop/10000809) at ICLR — our second edition! Proceedings coming soon.

- date: "10 Mar 2026"
  tag: "paper"
  content: >
    [On the Fisher Geometry of Diffusion Models' Latent Space](https://openreview.net/forum?id=rD62pvl9vW) accepted as a poster at ICLR GRaM 2026.
    Led by Maria, a lovely follow-up to Rafał's spacetime paper.

- date: "26 Jan 2026"
  tag: "paper"
  content: >
    ICLR accepted two papers:
    [The Spacetime of Diffusion Models: An Information Geometry Perspective](https://arxiv.org/abs/2505.17517) (Oral)
    and [Riemannian Variational Flow Matching for Material and Protein Design](https://arxiv.org/abs/2502.12981) (Poster).
    A pleasure to work with the brilliant Rafał, Olga and Floor ♥

- date: "23 Dec 2025"
  tag: "workshop"
  content: >
    [GRaM](https://gram-workshop.github.io/index.html) got accepted as a workshop at ICLR, our second edition!
    We have a call for proceedings, tiny papers, blogposts and a competition coming soon.

- date: "9 Sep 2025"
  tag: "talk"
  content: >
    Gave a talk at [GPSS](https://gpss.cc/gpss25/slides/Pouplin2025.pdf) on Links between Riemannian geometry and Gaussian Processes. Thank you Carl Henrik Ek and Mauricio Alvarez for the invitation!

- date: "1 Jun 2025"
  tag: "news"
  content: >
    Started at Bayer in the MLR team, working on uncertainty quantification, BO and AL for small molecules and FEP prediction.

- date: "9 May 2025"
  tag: "workshop"
  content: >
    End of the wonderful workshop on [Geometry for statistics and AI](https://sites.google.com/view/g-stai/home?authuser=0), in the beautiful Metochi Study Center.
    Thank you Libby Baker, Stefan Sommer and Erlend Grong, for the invitations. We had so many exciting discussions and... wine. :)

- date: "18 Apr 2025"
  tag: "talk"
  content: >
    Gave a talk at the "Geometry and Information" seminar at HSE, organized by
    [Maxim Beketov](https://scholar.google.com/citations?user=9HoVvVsAAAAJ&hl=en).
    Loved the *Saint Petersburg Mathematicians and Their Discoveries* book gift.

- date: "24 Oct 2024"
  tag: "news"
  content: >
    First run of our [Geometric Deep Learning course](https://mycourses.aalto.fi/enrol/index.php?id=45501#section-0) at Aalto!
    Created together with Caglar Hizli, Katsiaryna Haitsiukevich and Erik Schultheis. So many lovely and smart students!

- date: "29 Jul 2024"
  tag: "workshop"
  content: >
    [GRaM 2024](https://icml.cc/virtual/2024/workshop/29975) at ICML, organised with the amazing [Sharv](https://scholar.google.com/citations?user=gfRkDXEAAAAJ&hl=en).
    Proceedings published in [PMLR](https://proceedings.mlr.press/v251/vadgama24a.html).

- date: "1 Feb 2024"
  tag: "news"
  content: >
    Started as a postdoc at Aalto University with Vikas Garg, Samuel Kaski and Markus Heinonen. Excited for a new chapter!

- date: "26 Oct 2023"
  tag: "news"
  content: >
    PhD defence day — extremely nervous, but so lucky to have the most amazing examiners:
    Frank Nielsen, Michael Bronstein and Mikkel N. Schmidt.
    And the most incredibly supportive mentors and PI ever: Søren Hauberg, Georgios Arvanitidis and Carl Henrik Ek. ♥

- date: "23 Feb 2023"
  tag: "talk"
  content: >
    Gave a talk at [TAG-DS](https://sites.google.com/view/tag-ds/home?authuser=0) on Finsler geometry —
    see the [paper](https://arxiv.org/abs/2212.10010).

- date: "Jun 2022"
  tag: "workshop"
  content: >
    Organised the [Hitchhiker's Guide to Complex Geometry](https://complexgeometrytalks.github.io/) reading group
    with the wonderful [Pablo A. Morales](https://scholar.google.com/citations?user=oJ6-p50AAAAJ&hl=en) (Araya Research)
    and [Challenger Mishra](https://scholar.google.com/citations?user=zGSN6k4AAAAJ&hl=en) (Cambridge University).

- date: "1 Jan 2022"
  tag: "news"
  content: >
    Started a 3-month internship at Relation Therapeutics. Together with Thomas, Alice, and Paul, we built
    [PyRelationAL](https://pyrelational.readthedocs.io/en/stable/), a Python active learning library.

- date: "Oct 2020"
  tag: "workshop"
  content: >
    Co-organised [CogSys ML Talks](https://cogsystalks.github.io/) at DTU with
    [Federico Bergamin](https://federicobergamin.github.io/): a seminar series on machine learning and applied mathematics.
    Lovely community building during covid, and some speakers ended up working together. :)

- date: "1 Mar 2020"
  tag: "news"
  content: >
    Start of my academic journey and my PhD... with the amazing [Søren Hauberg](https://www2.compute.dtu.dk/~sohau/) at DTU. ♥
